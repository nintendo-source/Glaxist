<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glaxist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">
          <!-- Isometric Grass/Dirt Block Logo matching Screenshot Angle -->
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 3L28 9L16 15L4 9L16 3Z" fill="#79c057"/>
            <path d="M10 6L14 8L12 11L8 9L10 6Z" fill="#5b9239"/>
            <path d="M20 7L24 9L22 12L18 10L20 7Z" fill="#5b9239"/>
            <path d="M4 11L16 17V29L4 23V11Z" fill="#73482a"/>
            <path d="M7 15H9V17H7V15Z" fill="#59361a"/>
            <path d="M11 20H13V22H11V20Z" fill="#59361a"/>
            <path d="M7 25H9V27H7V25Z" fill="#59361a"/>
            <path d="M28 11L16 17V29L28 23V11Z" fill="#59361a"/>
            <path d="M21 16H23V18H21V16Z" fill="#432813"/>
            <path d="M19 22H21V24H19V22Z" fill="#432813"/>
            <path d="M24 24H26V26H24V24Z" fill="#432813"/>
          </svg>
        </div>
        <span class="app-title">Glaxist</span>
      </div>

      <div class="nav-menu">
        <button class="nav-item active" data-target="view-instances">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          Instances
        </button>
        <button class="nav-item" data-target="view-uploader">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
          Add Content
        </button>
      </div>

      <div class="sidebar-footer">
        <span class="version-tag">Portable Offline v1.0</span>
      </div>
    </div>

    <!-- Main Content Panel -->
    <div class="main-content">
      
      <div class="top-bar">
        <div class="search-indicator">Offline Mode Client</div>
        <div class="profile-pill">
          <span class="status-dot"></span>
          <input type="text" id="username" value="Glaxiblade" placeholder="Username...">
        </div>
      </div>

      <!-- VIEW 1: Instances -->
      <div id="view-instances" class="view-panel active">
        <div class="view-header flex-header">
          <div>
            <h2>Your Instances</h2>
            <p>Manage your custom Minecraft profiles.</p>
          </div>
          <button id="open-modal-btn" class="btn-white-outline">+ New Instance</button>
        </div>

        <div id="instances-grid" class="instances-grid"></div>

        <div class="action-footer">
          <button id="launch-btn" class="btn-white" disabled>Launch Game</button>
        </div>
      </div>

      <!-- VIEW 2: Content Uploader -->
      <div id="view-uploader" class="view-panel">
        <div class="view-header">
          <h2>Instance Content Uploader</h2>
          <p>Instantly drop mods (.jar) or resource packs (.zip) into your instances.</p>
        </div>

        <div class="uploader-card">
          <div class="form-group">
            <label>Target Instance</label>
            <select id="target-instance"></select>
          </div>

          <div class="form-group">
            <label>File Type</label>
            <select id="file-type">
              <option value="mods">Mod (.jar)</option>
              <option value="resourcepacks">Resource Pack (.zip)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Select File</label>
            <div class="dropzone">
              <input type="file" id="file-input" accept=".jar,.zip">
              <span id="file-label">Click here to browse file...</span>
            </div>
          </div>

          <button id="upload-btn" class="btn-white">Upload to Instance</button>
        </div>
      </div>

      <div class="status-console">
        <span id="status-text">Ready</span>
      </div>

    </div>
  </div>

  <!-- Create Instance Modal -->
  <div id="create-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Create New Instance</h3>
      
      <div class="form-group">
        <label>Instance Name</label>
        <input type="text" id="modal-name" placeholder="e.g. PvP Manhunt 1.20">
      </div>

      <div class="form-group">
        <label>Minecraft Version</label>
        <select id="modal-version">
          <option value="1.20.1">1.20.1 (Recommended)</option>
          <option value="1.20.4">1.20.4</option>
          <option value="1.21">1.21</option>
          <option value="1.19.2">1.19.2</option>
        </select>
      </div>

      <div class="form-group">
        <label>Instance Logo (PNG)</label>
        <div class="dropzone sm-dropzone">
          <input type="file" id="modal-logo" accept=".png">
          <span id="logo-label">Choose PNG logo...</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-create" class="btn-white">Create Instance</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
